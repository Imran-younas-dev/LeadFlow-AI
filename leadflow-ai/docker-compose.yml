# Run n8n locally:  docker compose up -d   ->  http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: leadflow-n8n
    restart: unless-stopped
    ports:
      # Localhost only, so the editor is not open on the LAN. Day 19 adds real auth.
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
